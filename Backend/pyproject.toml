[project]
name = "dressify-backend"
version = "0.1.0"
description = "Backend for Dressify Virtual Try-On"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.2.1",
    "supabase>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "rembg>=2.0.50",
    "opencv-python-headless>=4.9.0",
    "pyjwt>=2.8.0",
    "openai>=1.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

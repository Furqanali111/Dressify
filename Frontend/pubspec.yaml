name: dressify_frontend
description: Dressify — 2D virtual try-on mobile app (UI layer only).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State + DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.6.2

  # Design system
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0

  # Auth (UI-only — gets Google ID token, hands to backend)
  google_sign_in: ^6.2.1

  # Backend communication (the ONLY data path)
  dio: ^5.7.0

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Runtime config
  flutter_dotenv: ^5.2.1

  # Media I/O (UI-level capture, no processing)
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  cached_network_image: ^3.4.1

  # Try-on canvas (escalation path; we start with CustomPainter)
  flame: ^1.22.0

  # Modeling
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.19.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.3

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/icons/
    - assets/avatars/
    - assets/images/
    - .env

name: dressify
description: Dressify — AI-powered wardrobe & virtual try-on app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State + DI
  flutter_riverpod: ^2.5.1
  equatable: ^2.0.7
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.6.2

  # Design system
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0

  # Auth (UI-only — gets Google ID token, hands to backend)
  google_sign_in: ^6.2.1

  # Backend communication (the ONLY data path)
  dio: ^5.7.0

  # Local storage
  flutter_secure_storage: ^10.0.0   # 10.x: DataStore 1.1+ (16 KB-aligned native lib)
  shared_preferences: ^2.5.0        # 2.5+: DataStore 1.1+ (16 KB-aligned native lib)

  # Runtime config
  flutter_dotenv: ^5.2.1

  # Media I/O (UI-level capture, no processing)
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  cached_network_image: ^3.4.1
  path_provider: ^2.1.3

  # 3D Rendering
  model_viewer_plus: ^1.8.0

  # Camera & real-time try-on (Phase 3)
  camera: ^0.11.0
  google_mlkit_pose_detection: ^0.14.0  # 0.14+: 16 KB-aligned libxeno_native.so / libimage_processing_util_jni.so
  google_mlkit_selfie_segmentation: ^0.10.1
  share_plus: ^10.0.1

  # Location (Weather Context)
  geolocator: ^13.0.0

  # Try-on canvas (escalation path; we start with CustomPainter)
  flame: ^1.22.0

  # Modeling
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.19.0
  collection: ^1.19.0
  permission_handler: ^12.0.1
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/icons/
    - assets/avatars/
    - assets/images/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/01_app_icon.png"
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: "assets/logo/01_app_icon.png"
  min_sdk_android: 21
